<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Maison">
  <meta name="theme-color" content="#091b18">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Au Verger des Louves - Écran mural</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css?family=Readex+Pro:400,700|Fraunces:600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background-color: #091b18; color: #f0eee5;
      font-family: 'Readex Pro', -apple-system, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .container { width: 100%; height: 100%; padding: 12px; display: table; table-layout: fixed; }
    .col-left   { display: table-cell; width: 36%; vertical-align: top; padding-right: 12px; }
    .col-center { display: table-cell; width: 34%; vertical-align: top; padding-right: 12px; }
    .col-right  { display: table-cell; width: 30%; vertical-align: top; }
    .card {
      background-color: #10372d; border-radius: 14px; padding: 14px;
      margin-bottom: 12px; border: 1px solid #1d4a3e;
    }
    .card-title {
      font-family: 'Fraunces', Georgia, serif; font-size: 16px; letter-spacing: 0.5px;
      color: #b9b58d; margin-bottom: 10px; font-weight: 600;
    }

    /* HORLOGE */
    .clock-card { text-align: center; padding: 12px 10px 12px; }
    .brand { overflow: hidden; margin-bottom: 6px; }
    .brand img { width: 88%; height: auto; -webkit-filter: brightness(0) invert(0.94); filter: brightness(0) invert(0.94); }
    #clock-time { font-size: 56px; font-weight: 700; letter-spacing: 2px; color: #f0eee5; line-height: 1; }
    #clock-sec { font-size: 24px; color: #aed100; vertical-align: top; margin-left: 4px; }
    #clock-date { font-size: 17px; color: #dfddd2; margin-top: 8px; }
    #clock-date:first-letter { text-transform: uppercase; }
    #clock-eph { font-size: 13px; color: #dfddd2; margin-top: 6px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .eph-sun { color: #b9b58d; font-size: 13px; }

    /* METEO */
    .weather-now { overflow: hidden; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #1d4a3e; }
    .weather-temp { float: left; font-size: 44px; font-weight: bold; color: #aed100; }
    .weather-desc { float: right; text-align: right; padding-top: 6px; }
    .weather-city { font-size: 16px; font-weight: bold; }
    .weather-condition { font-size: 14px; color: #dfddd2; margin-top: 3px; }
    .forecast-row { overflow: hidden; padding: 5px 0; font-size: 15px; }
    .f-day { float: left; width: 45%; text-transform: capitalize; }
    .f-icon { float: left; width: 25%; text-align: center; }
    .f-temps { float: right; width: 30%; text-align: right; color: #dfddd2; }
    .w-updated { font-size: 11px; color: #b9b58d; text-align: right; margin-top: 4px; }

    /* SMART LIFE */
    .smart-grid { overflow: hidden; }
    .smart-btn {
      float: left; width: 48%; margin-bottom: 8px; padding: 14px 8px;
      background-color: #091b18; border: 1px solid #1d4a3e; border-radius: 10px;
      color: #f0eee5; font-size: 15px; font-weight: bold; text-align: center; cursor: pointer;
    }
    .smart-btn:nth-child(odd) { margin-right: 4%; }
    .smart-btn:active, .smart-btn.sent { background-color: #aed100; border-color: #aed100; color: #091b18; }
    #smart-status { clear: both; font-size: 12px; color: #aed100; text-align: center; height: 16px; }

    /* ASSISTANT */
    .cmd-wrap { overflow: hidden; }
    #cmd-mic {
      float: left; width: 52px; height: 44px; font-size: 22px; border: none; border-radius: 10px;
      background-color: #aed100; color: #091b18; -webkit-appearance: none;
    }
    #cmd-mic.listening { background-color: #b56953; }
    #cmd-input {
      float: right; width: calc(100% - 60px); width: -webkit-calc(100% - 60px); height: 44px; padding: 0 10px;
      font-size: 15px; border-radius: 10px; border: 1px solid #1d4a3e; background-color: #091b18; color: #f0eee5;
      font-family: inherit; -webkit-appearance: none;
    }
    #cmd-reply { margin-top: 8px; font-size: 13px; color: #dfddd2; min-height: 18px; line-height: 1.4; }

    /* AGENDA */
    .agenda-card { height: 515px; }

    /* MINUTEUR */
    .timer-card { height: 152px; }
    .tm-row { overflow: hidden; margin-bottom: 8px; }
    #tm-display { float: left; font-size: 40px; font-weight: 700; line-height: 46px; color: #dfddd2; letter-spacing: 1px; }
    #tm-display.run { color: #aed100; }
    .tm-ctrl { float: right; }
    .tm-ctrl button, .tm-presets button {
      height: 42px; border-radius: 10px; font-size: 18px; font-weight: bold; font-family: inherit;
      -webkit-appearance: none; cursor: pointer;
    }
    .tm-ctrl button { width: 52px; margin-left: 6px; border: none; }
    #tm-go { background-color: #aed100; color: #091b18; font-size: 16px; }
    #tm-reset { background-color: #091b18; color: #f0eee5; border: 1px solid #1d4a3e !important; }
    .tm-presets { overflow: hidden; }
    .tm-presets button {
      float: left; width: 18.4%; margin-right: 2%; font-size: 14px;
      background-color: #091b18; color: #f0eee5; border: 1px solid #1d4a3e;
    }
    .tm-presets button:last-child { margin-right: 0; }
    .tm-presets button:active, .tm-ctrl button:active { background-color: #aed100; color: #091b18; }
    #tm-alarm {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 300;
      background-color: #aed100; color: #091b18; text-align: center; padding-top: 22%;
      font-size: 48px; font-weight: bold; -webkit-animation: tmflash 1s infinite; animation: tmflash 1s infinite;
    }
    #tm-alarm small { display: block; font-size: 20px; font-weight: normal; margin-top: 16px; }
    @-webkit-keyframes tmflash { 0%, 100% { background-color: #aed100; } 50% { background-color: #b56953; } }
    @keyframes tmflash { 0%, 100% { background-color: #aed100; } 50% { background-color: #b56953; } }
    .ag-legend { display: block; margin-top: 4px; white-space: nowrap; overflow: hidden; font-family: 'Readex Pro', -apple-system, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: normal; letter-spacing: 0; padding-top: 3px; }
    .ag-legend span { margin-right: 8px; color: #dfddd2; }
    .ag-dot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 4px; }
    #agenda-list { height: 434px; overflow-y: auto; }
    #agenda-list::-webkit-scrollbar { display: none; }
    .ag-day { font-family: 'Fraunces', Georgia, serif; font-size: 15px; color: #b9b58d; margin: 12px 0 6px; }
    .ag-day:first-child { margin-top: 0; }
    .ag-day.today { color: #aed100; }
    .ag-ev {
      overflow: hidden; background-color: #091b18; border-radius: 8px; margin-bottom: 6px;
      padding: 8px 10px; border-left: 4px solid #aed100;
    }
    .ag-ev.past { opacity: 0.45; }
    .ag-time { float: left; width: 58px; font-size: 14px; font-weight: bold; color: #f0eee5; line-height: 1.3; }
    .ag-time small { display: block; font-size: 11px; font-weight: normal; color: #b9b58d; }
    .ag-body { margin-left: 62px; }
    .ag-title { font-size: 15px; line-height: 1.3; color: #f0eee5; }
    .ag-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
    .ag-msg { color: #b9b58d; font-size: 14px; text-align: center; padding-top: 170px; line-height: 1.6; }
    .ag-msg input {
      width: 70%; padding: 8px; margin-top: 10px; font-size: 16px; border-radius: 8px; text-align: center;
      border: 1px solid #1d4a3e; background-color: #091b18; color: #f0eee5; -webkit-appearance: none;
    }
    .ag-msg button {
      margin-top: 8px; padding: 8px 18px; font-size: 15px; border: none; border-radius: 8px;
      background-color: #aed100; color: #091b18; font-weight: bold; -webkit-appearance: none;
    }

    /* LISTE DE COURSES */
    .todo-card { height: 430px; }
    .todo-input-wrap { overflow: hidden; margin-bottom: 10px; }
    #todo-input {
      float: left; width: 74%; padding: 10px; font-size: 16px; border-radius: 8px;
      border: 1px solid #1d4a3e; background-color: #091b18; color: #f0eee5;
      font-family: inherit; -webkit-appearance: none;
    }
    #todo-add {
      float: right; width: 23%; padding: 10px 0; font-size: 18px; font-weight: bold;
      border-radius: 8px; border: none; background-color: #aed100; color: #091b18;
      -webkit-appearance: none;
    }
    #todo-list { list-style: none; height: 300px; overflow-y: auto; }
    .todo-item { padding: 10px 8px; border-bottom: 1px solid #1d4a3e; font-size: 16px; overflow: hidden; }
    .todo-text { float: left; width: 82%; }
    .todo-item.done .todo-text { text-decoration: line-through; color: #b9b58d; }
    .todo-del { float: right; color: #b56953; font-weight: bold; padding: 0 6px; }
    #todo-clear {
      display: block; width: 100%; margin-top: 6px; padding: 6px; font-size: 12px;
      color: #b9b58d; background: none; border: 1px solid #1d4a3e; border-radius: 8px;
      font-family: inherit; -webkit-appearance: none;
    }

    /* NOTE FAMILIALE */
    .note-card { height: 280px; }
    #family-note {
      width: 100%; height: 225px; background-color: #091b18; border: 1px solid #1d4a3e;
      border-radius: 8px; color: #f0eee5; font-size: 16px; padding: 10px; resize: none;
      font-family: inherit; -webkit-appearance: none;
    }

    /* NOTIFICATIONS DU KOTA */
    #kota-pop {
      display: none; position: fixed; top: 20px; left: 50%; width: 600px; margin-left: -300px; z-index: 250;
      background-color: #091b18; border: 3px solid #aed100; border-radius: 16px; padding: 6px 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .kp-item { padding: 12px 0; border-bottom: 1px solid #1d4a3e; }
    .kp-item:last-child { border-bottom: none; }
    .kp-head { font-size: 13px; color: #b9b58d; letter-spacing: 1px; text-transform: uppercase; }
    .kp-title { font-size: 24px; font-weight: bold; color: #aed100; margin-top: 2px; }
    .kp-msg { font-size: 17px; color: #f0eee5; margin: 6px 0 12px; line-height: 1.35; }
    .kp-item button {
      height: 46px; padding: 0 22px; margin-right: 10px; border-radius: 10px; font-size: 17px; font-weight: bold;
      font-family: inherit; -webkit-appearance: none; cursor: pointer;
    }
    .kp-ack { background-color: #aed100; color: #091b18; border: none; }
    .kp-ok { background-color: #12352e; color: #f0eee5; border: 1px solid #1d4a3e; }

    /* MODE NUIT : voile sombre, un appui le retire 1 minute */
    #night-veil {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #000; opacity: 0.85; z-index: 100;
    }
    /* TÉLÉPHONE : tout sur une seule colonne, qu'on fait défiler */
    @media (max-width: 700px) {
      html, body { overflow: auto; height: auto; }
      .container { display: flex; flex-direction: column; height: auto; padding: 10px; }
      .col-left, .col-center, .col-right { display: contents; }
      .card { height: auto !important; }
      .c-clock { order: 1; } .c-assist { order: 2; } .c-timer { order: 3; } .c-todo { order: 4; } .c-agenda { order: 5; }
      .c-maison { order: 6; } .c-meteo { order: 7; } .c-note { order: 8; } .c-raccourcis { order: 9; }
      #tm-alarm { padding-top: 45%; font-size: 36px; }
      #agenda-list { height: auto; max-height: 420px; }
      #todo-list { height: auto; max-height: none; }
      #family-note { height: 160px; }
      #cmd-mic { width: 64px; height: 52px; font-size: 26px; }
      #cmd-input { height: 52px; width: calc(100% - 72px); font-size: 16px; }
      #clock-time { font-size: 48px; }
      #night-veil { display: none !important; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- COLONNE GAUCHE : HORLOGE + METEO + SMART LIFE -->
  <div class="col-left">
    <div class="card clock-card c-clock">
      <div class="brand"><img src="https://vergerdeslouves.fr/wp-content/uploads/2023/09/fff.png" alt="Au Verger des Louves" onerror="this.style.display='none'"></div>
      <div><span id="clock-time">00:00</span><span id="clock-sec">00</span></div>
      <div id="clock-date">Chargement...</div>
      <div id="clock-eph"></div>
    </div>

    <div class="card c-meteo">
      <div class="card-title">Météo</div>
      <div class="weather-now">
        <div class="weather-temp" id="w-temp">--°</div>
        <div class="weather-desc">
          <div class="weather-city">Helfrantzkirch</div>
          <div class="weather-condition" id="w-cond">Actualisation...</div>
        </div>
      </div>
      <div id="w-forecast"></div>
      <div class="w-updated" id="w-updated"></div>
    </div>

    <div class="card c-maison">
      <div class="card-title">Maison</div>
      <div class="smart-grid">
        <div class="smart-btn" onclick="triggerSmart('tout_on', this)">💡 Tout allumer</div>
        <div class="smart-btn" onclick="triggerSmart('tout_off', this)">🌙 Tout éteindre</div>
      </div>
      <div id="smart-status"></div>
    </div>

    <div class="card c-assist">
      <div class="card-title">Assistant</div>
      <div class="cmd-wrap">
        <button id="cmd-mic" onclick="micTap()">🎤</button>
        <input type="text" id="cmd-input" placeholder="Ex. : ajoute du lait et des œufs" autocomplete="off">
      </div>
      <div id="cmd-reply"></div>
    </div>
  </div>

  <!-- COLONNE CENTRALE : AGENDA -->
  <div class="col-center">
    <div class="card agenda-card c-agenda">
      <div class="card-title">Agenda <span class="ag-legend" id="ag-legend"></span></div>
      <div id="agenda-list"><div class="ag-msg">Chargement de l'agenda...</div></div>
    </div>
    <div class="card timer-card c-timer">
      <div class="card-title">Minuteur</div>
      <div class="tm-row">
        <div id="tm-display">00:00</div>
        <div class="tm-ctrl">
          <button id="tm-go" onclick="tmToggle()">▶</button><button id="tm-reset" onclick="tmReset()">↺</button>
        </div>
      </div>
      <div class="tm-presets">
        <button onclick="tmPreset(1)">+1</button><button onclick="tmPreset(5)">+5</button><button onclick="tmPreset(10)">+10</button><button onclick="tmPreset(15)">+15</button><button onclick="tmPreset(30)">+30</button>
      </div>
    </div>
    <div class="card c-raccourcis" style="height: 48px; padding: 12px 14px;">
      <p style="font-size: 14px; color: #dfddd2; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">🗑️ Poubelles : <b id="trash-next">...</b></p>
    </div>
  </div>

  <!-- COLONNE DROITE : LISTE DE COURSES + NOTE -->
  <div class="col-right">
    <div class="card todo-card c-todo">
      <div class="card-title">Liste de courses</div>
      <div class="todo-input-wrap">
        <input type="text" id="todo-input" placeholder="Ajouter un article..." autocomplete="off">
        <button id="todo-add" onclick="addTodo()">+</button>
      </div>
      <ul id="todo-list"></ul>
      <button id="todo-clear" onclick="clearDone()">Retirer les articles cochés</button>
    </div>

    <div class="card note-card c-note">
      <div class="card-title">Mémo famille</div>
      <textarea id="family-note" placeholder="Écrire un message pour la famille..."></textarea>
    </div>
  </div>
</div>

<div id="night-veil" onclick="wakeUp()"></div>
<div id="kota-pop"></div>
<div id="tm-alarm" onclick="tmStopAlarm()">⏰ Minuteur terminé !<small>Touche l'écran pour arrêter</small></div>

<script>
  /* =========================================================
     RÉGLAGES — seule partie à modifier
     ========================================================= */
  var CONFIG = {
    // Coordonnées pour la météo (Helfrantzkirch)
    lat: 47.608,
    lon: 7.416,

    // Adresse du script Google qui lit les agendas (Apps Script, "/exec")
    agendaScript: 'https://script.google.com/macros/s/AKfycbyMVqA25gXgIfVRXzXCMrcoepVy7l8ceXsPXqJRuhsF2SlKxooWwcRqmlOCI_wYM9A/exec',
    agendaJours: 7,

    // Liens de déclenchement des lumières (un par bouton). Laisser vide = bouton inactif.
    // (créés sur virtualsmarthome.xyz/url_routine_trigger, reliés à des routines Alexa)
    smart: {
      tout_on: 'https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=d163655f-91b0-4522-b284-7ad8ae1281c7&token=53b88e84-94d5-460a-933e-343fef634c79&response=json',
      tout_off: 'https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=3cd3bd73-8621-4efe-9a7c-02cbcd847f8a&token=3bf632ec-0e47-41ad-ad3f-1a36a1317ae3&response=json'
    },

    // Poubelles : un passage de référence (année, mois, jour) et l'intervalle en jours
    trashRef: [2026, 11, 17],
    trashEvery: 14,

    // Mode nuit : voile sombre entre ces heures (mettre -1 pour désactiver)
    nightStart: 22,
    nightEnd: 6
  };

  /* --- Outils --- */
  var jours = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function $(id) { return document.getElementById(id); }

  function store(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function load(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  /* --- 1. HORLOGE + MODE NUIT + RECHARGEMENT QUOTIDIEN --- */
  var awakeUntil = 0;

  function isNight(h) {
    if (CONFIG.nightStart < 0) return false;
    if (CONFIG.nightStart > CONFIG.nightEnd) return h >= CONFIG.nightStart || h < CONFIG.nightEnd;
    return h >= CONFIG.nightStart && h < CONFIG.nightEnd;
  }

  function wakeUp() {
    awakeUntil = new Date().getTime() + 60 * 1000;
    $('night-veil').style.display = 'none';
  }

  /* --- ÉPHÉMÉRIDE : fête du jour + lever/coucher du soleil --- */
  // Calendrier traditionnel des fêtes (un mois par ligne, jours séparés par |, * = fête plutôt qu'un prénom)
  var FETES = [
    "*Jour de l'An|Basile|Geneviève|Odilon|Édouard|Mélaine|Raymond|Lucien|Alix|Guillaume|Paulin|Tatiana|Yvette|Nina|Rémi|Marcel|Roseline|Prisca|Marius|Sébastien|Agnès|Vincent|Barnard|François de Sales|Paul|Paule|Angèle|Thomas d'Aquin|Gildas|Martine|Marcelle",
    "Ella|*Chandeleur|Blaise|Véronique|Agathe|Gaston|Eugénie|Jacqueline|Apolline|Arnaud|*Notre-Dame de Lourdes|Félix|Béatrice|Valentin|Claude|Julienne|Alexis|Bernadette|Gabin|Aimée|Damien|Isabelle|Lazare|Modeste|Roméo|Nestor|Honorine|Romain|Auguste",
    "Aubin|Charles|Guénolé|Casimir|Olive|Colette|Félicité|Jean de Dieu|Françoise|Vivien|Rosine|Justine|Rodrigue|Mathilde|Louise|Bénédicte|Patrice|Cyrille|Joseph|Herbert|Clémence|Léa|Victorien|Catherine|*Annonciation|Larissa|Habib|Gontran|Gwladys|Amédée|Benjamin",
    "Hugues|Sandrine|Richard|Isidore|Irène|Marcellin|Jean-Baptiste|Julie|Gautier|Fulbert|Stanislas|Jules|Ida|Maxime|Paterne|Benoît-Joseph|Anicet|Parfait|Emma|Odette|Anselme|Alexandre|Georges|Fidèle|Marc|Alida|Zita|Valérie|Catherine|Robert",
    "*Fête du Travail|Boris|Philippe et Jacques|Sylvain|Judith|Prudence|Gisèle|*Victoire 1945|Pacôme|Solange|Estelle|Achille|Rolande|Matthias|Denise|Honoré|Pascal|Éric|Yves|Bernardin|Constantin|Émile|Didier|Donatien|Sophie|Bérenger|Augustin|Germain|Aymar|Ferdinand|Perrine",
    "Justin|Blandine|Kévin|Clotilde|Igor|Norbert|Gilbert|Médard|Diane|Landry|Barnabé|Guy|Antoine|Élisée|Germaine|Jean-François|Hervé|Léonce|Romuald|Silvère|Rodolphe|Alban|Audrey|Jean-Baptiste|Prosper|Anthelme|Fernand|Irénée|Pierre et Paul|Martial",

  // Dimanche de Pâques (algorithme de Meeus)
  function paques(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
        f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
        i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
        m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31),
        da = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, mo - 1, da);
  }
  function plusJours(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function memeJour(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function feteMobile(d) {
    var y = d.getFullYear(), p = paques(y);
    var liste = [[-47, 'Mardi gras'], [-46, 'Mercredi des Cendres'], [-7, 'Rameaux'], [-2, 'Vendredi saint'],
                 [0, 'Pâques'], [1, 'Lundi de Pâques'], [39, 'Ascension'], [49, 'Pentecôte'], [50, 'Lundi de Pentecôte']];
    for (var i = 0; i < liste.length; i++) if (memeJour(d, plusJours(p, liste[i][0]))) return liste[i][1];
    // Fête des mères : dernier dimanche de mai (1er dimanche de juin si c'est la Pentecôte)
    var fm = new Date(y, 4, 31); fm = plusJours(fm, -fm.getDay());
    if (memeJour(fm, plusJours(p, 49))) fm = plusJours(fm, 7);
    if (memeJour(d, fm)) return 'Fête des mères';
    var fp = new Date(y, 5, 1); fp = plusJours(fp, (7 - fp.getDay()) % 7 + 14);   // 3e dimanche de juin
    if (memeJour(d, fp)) return 'Fête des pères';
    if (d.getMonth() === 1 && d.getDate() === 14) return 'Saint-Valentin';
    return '';
  }
  // Lever et coucher du soleil (formules NOAA), en minutes depuis minuit, heure locale
  function soleil(d) {
    var rad = Math.PI / 180, lat = CONFIG.lat * rad;
    var n = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(d.getFullYear(), 0, 1)) / 86400000);
    var g = 2 * Math.PI / 365 * (n + 0.5);
    var eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
    var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g)
             + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    var ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat) * Math.cos(decl)) - Math.tan(lat) * Math.tan(decl)) / rad;
    var midi = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
    var decal = -midi.getTimezoneOffset();
    return [720 - 4 * (CONFIG.lon + ha) - eq + decal, 720 - 4 * (CONFIG.lon - ha) - eq + decal];
  }
  function hmMin(min) { min = Math.round(min); return Math.floor(min / 60) + 'h' + pad(min % 60); }
  var ephJour = '';
  function updateEph(now) {
    var cle = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
    if (cle === ephJour) return;
    ephJour = cle;
    var nom = (FETES[now.getMonth()].split('|')[now.getDate() - 1]) || '';
    var evt = feteMobile(now), txt;
    if (nom.charAt(0) === '*') { evt = evt ? evt + ' · ' + nom.substr(1) : nom.substr(1); nom = ''; }
    if (evt && nom) txt = '🎉 ' + evt + ' · fête des ' + nom;
    else if (evt) txt = '🎉 ' + evt;
    else txt = '🌸 Fête : ' + nom;
    var s = soleil(now);
    $('clock-eph').innerHTML = txt + ' <span class="eph-sun">· ☀️ ' + hmMin(s[0]) + ' → ' + hmMin(s[1]) + '</span>';
  }

  function updateClock() {
    var now = new Date();
    $('clock-time').innerHTML = pad(now.getHours()) + ':' + pad(now.getMinutes());
    $('clock-sec').innerHTML = pad(now.getSeconds());
    $('clock-date').innerHTML = jours[now.getDay()] + ' ' + now.getDate() + ' ' + mois[now.getMonth()];

    $('night-veil').style.display = veil ? 'block' : 'none';

    // Recharge la page chaque nuit à 3h00 (évite que le vieil iPad sature sa mémoire)
    if (now.getHours() === 3 && now.getMinutes() === 0 && now.getSeconds() === 0) {
      location.reload();
    }
  }

  /* --- 1b. POUBELLES (mardi matin, tous les 15 jours) --- */
  function updateTrash() {
    var DAY = 24 * 60 * 60 * 1000;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var ref = new Date(CONFIG.trashRef[0], CONFIG.trashRef[1] - 1, CONFIG.trashRef[2]);
    var diff = Math.round((today - ref) / DAY);
    var k = Math.ceil(diff / CONFIG.trashEvery);
    var next = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() + k * CONFIG.trashEvery);
    var days = Math.round((next - today) / DAY);
    var el = $('trash-next');
    var label = jours[next.getDay()] + ' ' + (next.getDate() === 1 ? '1er' : next.getDate()) + ' ' + mois[next.getMonth()];
    if (days === 0) { el.innerHTML = "aujourd'hui !"; el.style.color = '#b56953'; }
    else if (days === 1) { el.innerHTML = 'demain, à sortir ce soir !'; el.style.color = '#aed100'; }
    else { el.innerHTML = label + ' (J-' + days + ')'; el.style.color = ''; }
  }

  /* --- 2. METEO (Open-Meteo, gratuit, sans clé) --- */
  function getWeatherLabel(code) {
    if (code === 0) return '☀️ Ensoleillé';

    if (code <= 48) return '🌫️ Brouillard';
    if (code <= 67) return '🌧️ Pluie';
    if (code <= 77) return '❄️ Neige';

  function fetchWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon
      + '&current_weather=true'
      + '&daily=weathercode,temperature_2m_max,temperature_2m_min'
      + '&timezone=Europe%2FParis&forecast_days=4';

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 15000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status !== 200) {
        $('w-cond').innerHTML = 'Météo indisponible';
        return;
      }
      try {
        var data = JSON.parse(xhr.responseText);
        var current = data.current_weather;
        $('w-temp').innerHTML = Math.round(current.temperature) + '°';
        $('w-cond').innerHTML = getWeatherLabel(current.weathercode);

        var html = '';
        for (var i = 1; i <= 3; i++) {
          var d = parseDay(data.daily.time[i]);

          var icon = getWeatherLabel(data.daily.weathercode[i]).split(' ')[0];
          var tmin = Math.round(data.daily.temperature_2m_min[i]);
          var tmax = Math.round(data.daily.temperature_2m_max[i]);
          html += '<div class="forecast-row">'
            + '<div class="f-day">' + dayName + '</div>'
            + '<div class="f-icon">' + icon + '</div>'
            + '<div class="f-temps">' + tmin + '° / ' + tmax + '°</div>'
            + '</div>';
        }
        $('w-forecast').innerHTML = html;

        var n = new Date();
        $('w-updated').innerHTML = 'Mis à jour à ' + pad(n.getHours()) + ':' + pad(n.getMinutes());
      } catch (e) {
        $('w-cond').innerHTML = 'Météo indisponible';
      }
    };
    xhr.send();
  }
  fetchWeather();

  /* --- 3. AGENDA (lu depuis le script Google, affichage maison) --- */
  var agData = null;

  // Code d'accès : passé une fois dans l'adresse (?code=...) puis gardé sur l'iPad
  (function () {
    var m = /[?&]code=([^&#]+)/.exec(location.search);

  function esc(t) {

  function hm(d) {
    return d.getHours() + 'h' + (d.getMinutes() ? pad(d.getMinutes()) : '');
  }
  // Raccourcit les titres des réservations du site (HBook)
  function shortTitle(t) {
    return String(t || '')
      .replace(/^Au Verger des Louves\s*R[ée]servation\s*[-–]\s*/i, '')
      .replace(/\s*[-–]\s*Resa\s*:\s*/i, ' · ')

  function dayKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }

  function askCode(msg) {
    agMessage((msg || 'Code d\'accès de l\'agenda') +

  function renderAgenda() {
    if (!agData) return;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var DAY = 24 * 60 * 60 * 1000;
    var groups = {}, order = [];

    function add(day, item) {
      var k = dayKey(day);
      if (!groups[k]) { groups[k] = { day: day, items: [] }; order.push(k); }
      groups[k].items.push(item);
    }

    for (var i = 0; i < agData.ev.length; i++) {
      var ev = agData.ev[i];
      var s = new Date(ev.s), f = new Date(ev.f);
      if (ev.j) {
        // Journée entière (éventuellement sur plusieurs jours) : affichée chaque jour concerné
        var d = new Date(s.getFullYear(), s.getMonth(), s.getDate());
        if (d < today) d = today;
        var guard = 0;
        while (d < f && guard < 40) {
          add(new Date(d.getTime()), ev);
          d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
          guard++;
        }
      } else {
        if (f < today) continue;
        var sd = new Date(s.getFullYear(), s.getMonth(), s.getDate());
        add(sd < today ? today : sd, ev);
      }
    }

    order.sort(function (a, b) { return groups[a].day - groups[b].day; });

    var html = '';
    for (var g = 0; g < order.length; g++) {
      var grp = groups[order[g]];
      var diff = Math.round((grp.day - today) / DAY);
      var label = diff === 0 ? "Aujourd'hui" : diff === 1 ? 'Demain'
        : jours[grp.day.getDay()] + ' ' + (grp.day.getDate() === 1 ? '1er' : grp.day.getDate()) + ' ' + mois[grp.day.getMonth()];
      label = label.charAt(0).toUpperCase() + label.slice(1);
      html += '<div class="ag-day' + (diff === 0 ? ' today' : '') + '">' + label + '</div>';

      // Journées entières d'abord, puis par heure
      grp.items.sort(function (a, b) { return (a.j === b.j) ? a.s - b.s : (a.j ? -1 : 1); });
      for (var k = 0; k < grp.items.length; k++) {
        var it = grp.items[k];
        var st = new Date(it.s), en = new Date(it.f);
        var past = !it.j && en < now;
        var time = it.j ? 'Journée' : hm(st) + '<small>' + hm(en) + '</small>';
        html += '<div class="ag-ev' + (past ? ' past' : '') + '" style="border-left-color:' + it.c + '">'
          + '<div class="ag-time">' + time + '</div>'
          + '<div class="ag-body"><div class="ag-title">' + esc(shortTitle(it.t) || '(sans titre)') + '</div>'
          + '<div class="ag-tag" style="color:' + it.c + '">' + esc(it.n) + '</div></div>'
          + '</div>';
      }
    }
    if (!html) html = '<div class="ag-msg">Rien de prévu ces prochains jours</div>';
    $('agenda-list').innerHTML = html;

    var leg = '';
    for (var l = 0; l < (agData.legende || []).length; l++) {
      leg += '<span><i class="ag-dot" style="background-color:' + agData.legende[l].c + '"></i>' + esc(agData.legende[l].n) + '</span>';
    }
    if (agData.maj) {
      var mj = new Date(agData.maj);
      leg += '<span style="color:#b9b58d">· maj ' + pad(mj.getHours()) + ':' + pad(mj.getMinutes()) + '</span>';
    }
    $('ag-legend').innerHTML = leg;
  }

  function loadAgenda() {
    if (!CONFIG.agendaScript) { agMessage('Agenda pas encore relié'); return; }

  /* --- NOTIFICATIONS DU KOTA (mêmes messages que l'appli ntfy, seulement sur l'écran mural) --- */
  var KOTA = { serveur: 'https://ntfy.sh', canal: 'verger-louves-kota-7Hq2' };
  var kotaDepuis = Math.floor(new Date().getTime() / 1000) - 120;   // au démarrage : les 2 dernières minutes
  var kotaVus = {}, kotaListe = [];
  function kotaPoll() {
    if (window.innerWidth <= 700) return;   // les téléphones ont déjà l'appli ntfy
    var x = new XMLHttpRequest();
    x.open('GET', KOTA.serveur + '/' + KOTA.canal + ',' + KOTA.canal + '-retour/json?poll=1&since=' + kotaDepuis, true);
    x.timeout = 15000;
    x.onload = function () {
      if (x.status !== 200) return;
      var lignes = x.responseText.split('\n'), nouveau = false, change = false;
      for (var i = 0; i < lignes.length; i++) {
        var m;
        try { m = JSON.parse(lignes[i]); } catch (e) { continue; }
        if (!m || m.event !== 'message' || kotaVus[m.id]) continue;
        kotaVus[m.id] = 1;
        if (m.time > kotaDepuis) kotaDepuis = m.time;
        if (m.topic === KOTA.canal + '-retour') {   // quelqu'un a répondu depuis son téléphone
          var id = String(m.message || '').replace(/^\s+|\s+$/g, '');
          for (var j = kotaListe.length - 1; j >= 0; j--) if (kotaListe[j].ack === id) { kotaListe.splice(j, 1); change = true; }
          continue;
        }
        var ack = '', label = '';
        if (m.actions) for (var k = 0; k < m.actions.length; k++) {
          if (m.actions[k].action === 'http' && m.actions[k].body) { ack = m.actions[k].body; label = m.actions[k].label || 'On arrive'; }
        }
        kotaListe.push({ titre: m.title || 'Kota', msg: m.message || '', ack: ack, label: label, t: m.time });
        nouveau = true;
      }
      if (kotaListe.length > 4) kotaListe.splice(0, kotaListe.length - 4);
      if (nouveau) kotaAlerte(kotaListe[kotaListe.length - 1]);
      if (nouveau || change) kotaRender();
    };
    x.send();
  }
  function kotaAlerte(n) {

  function kotaRender() {
    var maintenant = new Date().getTime() / 1000;
    for (var j = kotaListe.length - 1; j >= 0; j--) if (maintenant - kotaListe[j].t > 30 * 60) kotaListe.splice(j, 1);   // 30 min max
    var h = '';
    for (var i = 0; i < kotaListe.length; i++) {
      var n = kotaListe[i], d = new Date(n.t * 1000);
      h += '<div class="kp-item"><div class="kp-head">🔔 Kota · ' + d.getHours() + 'h' + pad(d.getMinutes()) + '</div>'

  function kotaFermer(i) { kotaListe.splice(i, 1); kotaRender(); }
  function kotaRepondre(i) {   // même réponse que le bouton « On arrive » de l'appli ntfy : la tablette du kota l'affiche

  // Sur iPad, le son ne peut être joué qu'après un premier appui sur l'écran

  var tmEnd = parseInt(load('dash_tm_end') || '0', 10) || 0;     // heure de fin si en marche
  var tmLeft = parseInt(load('dash_tm_left') || '0', 10) || 0;   // secondes restantes si en pause
  var tmCtx = null, tmAlarmTimer = null, tmAlarmCount = 0;

  function tmUnlock() {   // le son doit être "débloqué" par un appui (iPad)
    try {

  function tmSave() { store('dash_tm_end', String(tmEnd)); store('dash_tm_left', String(tmLeft)); }

  function tmFmt(sec) {
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
    return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(x);

  var tmLast = '';
  function tmRender() {   // ne redessine que si l'affichage change (évite des bugs d'affichage sur iOS 12)
    var k = tmFmt(tmRemaining()) + (tmEnd ? '+' : '-');

  function tmStart(sec) {

  function tmToggle() {
    tmUnlock();
    if (tmEnd) { tmLeft = tmRemaining(); tmEnd = 0; }
    else if (tmLeft > 0) { tmEnd = new Date().getTime() + tmLeft * 1000; tmLeft = 0; }
    tmSave(); tmRender();
  }
  function tmReset() { tmEnd = 0; tmLeft = 0; tmSave(); tmStopAlarm(); tmRender(); }

  function tmBeep() {
    if (!tmCtx) return;
    try {
      var t = tmCtx.currentTime;
      for (var i = 0; i < 3; i++) {
        var o = tmCtx.createOscillator(), g = tmCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(tmCtx.destination);
        g.gain.setValueAtTime(0.0001, t + i * 0.25);
        g.gain.exponentialRampToValueAtTime(0.7, t + i * 0.25 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.25 + 0.2);
        o.start(t + i * 0.25); o.stop(t + i * 0.25 + 0.22);
      }
    } catch (e) {}
  }
  function tmAlarm() {
    $('tm-alarm').style.display = 'block';
    tmAlarmCount = 0; tmBeep();
    clearInterval(tmAlarmTimer);
    tmAlarmTimer = setInterval(function () {
      tmAlarmCount++;
      if (tmAlarmCount > 120) { tmStopAlarm(); return; }   // s'arrête seul après 2 minutes
      tmBeep();
    }, 1000);
    if (window.Assistant) Assistant.speak('Le minuteur est terminé');
  }
  function tmStopAlarm() {
    clearInterval(tmAlarmTimer); tmAlarmTimer = null;
    $('tm-alarm').style.display = 'none';
  }
  function tmTick() {
    if (tmEnd && new Date().getTime() >= tmEnd) {
      var retard = new Date().getTime() - tmEnd;
      tmEnd = 0; tmLeft = 0; tmSave();
      if (retard < 5 * 60 * 1000) tmAlarm();   // pas d'alarme pour un minuteur fini depuis longtemps
    }
    tmRender();
  }
  setInterval(tmTick, 500);
  tmRender();

  /* --- 4. LUMIÈRES --- */
  var statusTimer = null;

  function showStatus(msg, color) {
    var el = $('smart-status');
    el.style.color = color || '#aed100';
    el.innerHTML = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { el.innerHTML = ''; }, 3000);
  }

  function triggerSmart(name, btn) {
    var url = CONFIG.smart[name];
    if (!url) {
      showStatus('Bouton pas encore configuré', '#dfddd2');
      return;
    }
    // Appel "image" : contourne les blocages CORS, la requête part quand même
    var ping = new Image();
    ping.src = url + (url.indexOf('?') === -1 ? '?' : '&') + '_t=' + new Date().getTime();
    btn.className = 'smart-btn sent';
    setTimeout(function () { btn.className = 'smart-btn'; }, 600);
    showStatus('Commande envoyée ✓');
  }

  /* --- 5. LISTE DE COURSES (partagée via le script Google) --- */
  var todos = [];
  try { todos = JSON.parse(load('dash_todos_cache')) || []; } catch (e) { todos = []; }

  function applyList(d) {
    // Première fois sur ce téléphone : indique le canal ntfy à suivre
    if (d && d.canal && load('dash_canal_vu') !== d.canal) {
      store('dash_canal_vu', d.canal);
      setTimeout(function () {
        window.alert('Notifications : dans l\'appli ntfy, touche « + » et abonne-toi au canal :\n\n' + d.canal +
                     '\n\n(serveur ntfy.sh par défaut)');
      }, 300);
    }
    if (d && d.liste) {
      todos = d.liste;
      store('dash_todos_cache', JSON.stringify(todos));
      renderTodos();
    }
    if (d && typeof d.memo === 'string') applyMemo(d.memo);
  }
  function srv(params) {
    if (window.Assistant) Assistant.api(params, applyList, function () {});
  }

  function renderTodos() {
    var list = $('todo-list');
    list.innerHTML = '';
    for (var i = 0; i < todos.length; i++) {
      (function (it) {
        var li = document.createElement('li');
        li.className = 'todo-item' + (it.d ? ' done' : '');
        var txt = document.createElement('span');
        txt.className = 'todo-text';
        txt.textContent = it.t;
        txt.onclick = function () { it.d = !it.d; renderTodos(); srv({ action: 'coche', id: it.id }); };
        var del = document.createElement('span');
        del.className = 'todo-del';
        del.textContent = '✕';
        del.onclick = function () {
          todos = todos.filter(function (x) { return x !== it; });
          renderTodos(); srv({ action: 'suppr', id: it.id });
        };
        li.appendChild(txt); li.appendChild(del); list.appendChild(li);
      })(todos[i]);
    }
  }

  function addTodo() {
    var input = $('todo-input');
    var val = input.value.replace(/^\s+|\s+$/g, '');
    if (!val) return;
    input.value = '';
    input.blur();
    todos.push({ id: 'tmp', t: val, d: false });
    renderTodos();
    srv({ action: 'ajout', texte: val });
  }

  function clearDone() {
    var kept = [];
    for (var i = 0; i < todos.length; i++) if (!todos[i].d) kept.push(todos[i]);
    todos = kept; renderTodos();
    srv({ action: 'nettoie' });
  }

  $('todo-input').onkeydown = function (e) { if (e.keyCode === 13) addTodo(); };
  renderTodos();

  /* --- 6. MÉMO FAMILLE (partagé) --- */
  var note = $('family-note');
  var noteTimer = null, noteEditing = false;
  note.value = load('dash_note') || '';
  function applyMemo(t) {
    if (noteEditing || document.activeElement === note) return;
    note.value = t; store('dash_note', t);
  }
  note.onfocus = function () { noteEditing = true; };
  note.onblur = function () { noteEditing = false; };
  note.oninput = function () {
    store('dash_note', note.value);
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { srv({ action: 'memo_ecrire', texte: note.value }); }, 1500);
  };

  /* --- 7. ASSISTANT (dictée de l'iPad ou micro du navigateur) --- */
  var cmdUi = {
    reply: function (t) { $('cmd-reply').innerHTML = esc(t); },
    onList: applyList,
    onMemo: applyMemo,
    confirm: function (m) { return window.confirm(m); },
    timer: function (act, sec) {
      if (act === 'start') tmStart(sec);
      else if (act === 'stop') tmReset();
      return tmEnd ? tmRemaining() : 0;
    }
  };
  function cmdRun() {
    var input = $('cmd-input');
    var v = input.value.replace(/^\s+|\s+$/g, '');
    if (!v) return;
    input.value = '';
    input.blur();
    $('cmd-reply').innerHTML = '« ' + esc(v) + ' »';
    Assistant.run(v, cmdUi);
  }
  function micTap() {
    if (!window.Assistant) return;
    var started = Assistant.listen(function (t) { $('cmd-input').value = t; cmdRun(); }, function (st) {
      $('cmd-mic').className = st === 'ecoute' ? 'listening' : '';
      if (st === 'ecoute') cmdUi.reply('Je t\'écoute…');
    });
    if (!started) {
      $('cmd-input').focus();
      cmdUi.reply('Touche le micro du clavier, parle, puis « OK ».');
    }
  }
  $('cmd-input').onkeydown = function (e) { if (e.keyCode === 13) cmdRun(); };

  // Sur l'écran mural : 'ecran'. Sur un téléphone : le prénom de la personne (demandé une fois).
  var monNom = load('dash_nom');
  if (window.innerWidth <= 700 && !monNom) {
    monNom = (window.prompt('Ton prénom ? (pour recevoir les notifications des autres)') || '').replace(/^\s+|\s+$/g, '');
    if (monNom) store('dash_nom', monNom);
  }
  window.ECRAN = { script: CONFIG.agendaScript, smart: CONFIG.smart,
                   appareil: window.innerWidth > 700 ? 'ecran' : (monNom || 'telephone') };

  /* Démarrage une fois assistant.js chargé */
  window.onload = function () {
    // Reprise unique de l'ancienne liste et de l'ancien mémo gardés sur l'iPad
    var old = null;
    try { old = JSON.parse(load('dash_todos')); } catch (e) {}
    if (old && old.length) {
      var txt = [];
      for (var i = 0; i < old.length; i++) if (!old[i].done) txt.push(old[i].text);
      if (txt.length) srv({ action: 'ajout', texte: txt.join(', ') });
    }
    try { localStorage.removeItem('dash_todos'); } catch (e) {}
    Assistant.api({ action: 'liste' }, function (d) {
      var loc = load('dash_note');
      if (!d.memo && loc) { srv({ action: 'memo_ecrire', texte: loc }); d.memo = loc; }
      applyList(d);
    }, function () {});
    setInterval(function () { srv({ action: 'liste' }); }, 30 * 1000);
    loadAgenda();
  };

  /* --- MISE À JOUR AUTOMATIQUE : recharge la page quand une nouvelle version est publiée --- */
  var VERSION = '2026-11-22a';
  function checkUpdate() {
    var x = new XMLHttpRequest();
    x.open('GET', location.pathname + '?check=' + new Date().getTime(), true);
    x.onload = function () {
      if (x.status !== 200) return;
      var m = /var VERSION = '([^']+)'/.exec(x.responseText);
      if (!m || m[1] === VERSION) return;
      var a = document.activeElement;
      if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;   // on attend la fin de la saisie
      location.replace(location.pathname + '?v=' + m[1]);
    };
    x.send();
  }
  setTimeout(checkUpdate, 20 * 1000);
  setInterval(checkUpdate, 5 * 60 * 1000);
</script>
